name: Frontend Workflow

on: 
    push:
        branches: [project_enhancement_v4]
        paths:  
            - 'frontend/**'

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node Environment
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json 

            - name: Install Dependencies
              run: npm ci
              working-directory: frontend

            - name: Build Package
              run: npm run build
              working-directory: frontend
              env:
                VITE_BACKEND_URL: ${{ secrets.PRODUCTION_BACKEND_URL }} 
                VITE_WS_URL: ${{ secrets.PRODUCTION_WS_URL }}
                CI: false

            - name: Trigger Static Site Update
              run: curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
